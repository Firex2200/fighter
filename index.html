<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fighter</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="apple-mobile-web-app-title" content="Fighter" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="ui.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1117;
        overflow: hidden;
        /* Stop iOS rubber-banding and double-tap zoom during play. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        /* No "copy / look up" popup when a thumb rests on a button. */
        -webkit-touch-callout: none;
        font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
      }
      #world {
        position: fixed;
        inset: 0;
      }
      #world canvas {
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* Touch buttons only during the fight; menus are tapped directly. */
      body:not(.in-match) #touch {
        display: none !important;
      }

      /* ---------------- touch controls (phones only; see src/touch.js)
         Sized from the screen height via --u, capped so tablets don't get giant
         buttons, and never below Apple's 44px minimum tap size. */
      #touch {
        position: fixed;
        inset: 0;
        pointer-events: none;
        --u: min(1vh, 4.2px);
      }
      .t-stick-zone {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 50%;
        pointer-events: auto;
      }
      /* GameCube stick: an octagonal gate with a grey cap. */
      .t-stick-base {
        position: absolute;
        left: calc(env(safe-area-inset-left) + var(--u) * 17);
        top: 70%;
        width: calc(var(--u) * 24);
        height: calc(var(--u) * 24);
        transform: translate(-50%, -50%);
        clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
        background: radial-gradient(circle, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.2));
        opacity: 0.35;
      }
      .t-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--u) * 11);
        height: calc(var(--u) * 11);
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #e4e6ee, #9a9fae);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        transform: translate(-50%, -50%);
      }
      .t-buttons {
        position: absolute;
        right: calc(env(safe-area-inset-right) + var(--u) * 4);
        bottom: calc(env(safe-area-inset-bottom) + var(--u) * 3);
        width: calc(var(--u) * 50);
        height: calc(var(--u) * 42);
      }
      .t-btn {
        --c: 205, 208, 218;
        --size: calc(var(--u) * 10.5);
        position: absolute;
        width: max(44px, var(--size));
        height: max(44px, var(--size));
        transform: translate(-50%, -50%);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: rgba(var(--c), 0.26);
        border: 2px solid rgba(var(--c), 0.8);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        pointer-events: auto;
        line-height: 1;
      }
      .t-btn b {
        font-size: max(15px, calc(var(--u) * 4.6));
      }
      .t-btn small {
        font-size: max(8px, calc(var(--u) * 2.2));
        opacity: 0.85;
        margin-top: 1px;
      }
      .t-btn.down {
        background: rgba(var(--c), 0.65);
      }
      /* Big green A in the middle, red B below-left, X/Y curved around A,
         yellow C where the C-stick sits. */
      .b-a { --c: 47, 179, 122; --size: calc(var(--u) * 15.5); left: 48%; top: 52%; }
      .b-b { --c: 224, 72, 77; left: 18%; top: 82%; }
      .b-x { left: 86%; top: 42%; height: max(52px, calc(var(--u) * 15)); border-radius: 48% / 50%; transform: translate(-50%, -50%) rotate(-12deg); }
      .b-y { left: 45%; top: 10%; width: max(52px, calc(var(--u) * 15)); border-radius: 50% / 48%; transform: translate(-50%, -50%) rotate(-10deg); }
      .b-c { --c: 242, 194, 48; left: 80%; top: 90%; }
      /* R: the shield shoulder button, in the top-right corner. */
      .b-r {
        --c: 160, 166, 182;
        left: auto;
        top: calc(env(safe-area-inset-top) + var(--u) * 5 + 22px);
        right: calc(env(safe-area-inset-right) + var(--u) * 4);
        transform: none;
        width: max(64px, calc(var(--u) * 19));
        border-radius: calc(var(--u) * 4) calc(var(--u) * 4) calc(var(--u) * 2) calc(var(--u) * 2);
      }

      /* ---------------- phone held upright */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0f1117;
        color: #cfd5e3;
        font-size: 20px;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      @media (pointer: coarse) and (orientation: portrait) {
        #rotate {
          display: flex;
        }
      }

      /* ---------------- laptop: QR code to open the game on a phone */
      #phone-qr {
        position: fixed;
        right: 14px;
        bottom: 14px;
        width: 112px;
        padding: 8px 8px 6px;
        background: #fff;
        border-radius: 8px;
        text-align: center;
        font-size: 11px;
        color: #222;
      }
      #phone-qr svg {
        width: 96px;
        height: 96px;
        display: block;
        margin: 0 auto 4px;
      }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="ui"></div>
    <div id="rotate">Turn your phone sideways to play</div>
    <script src="vendor/qrcode.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
